<div class="dashboard">
  <h2>Tableau de Bord</h2>

  <!-- ===== STATS CARDS ===== -->
  <div class="stats-grid" *ngIf="!loading">
    <div class="stat-card" *ngFor="let s of stats" [style.background]="s.color">
      <h3>{{ s.title }}</h3>
      <p>{{ s.value }}</p>
    </div>
  </div>

  <!-- ===== CHARTS ===== -->
  <div class="charts">
    <!-- PIE -->
    <div class="chart-card">
      <apx-chart [series]="pieSeries" [chart]="pieChart" [labels]="pieLabels"></apx-chart>
    </div>

    <!-- BAR -->
    <div class="chart-card">
      <apx-chart
        [series]="barSeries"
        [chart]="barChart"
        [xaxis]="{ categories: barLabels }"
        [plotOptions]="barPlotOptions"
        [dataLabels]="{ enabled: false }"
      ></apx-chart>
    </div>

    <!-- LINE -->
    <div class="chart-card">
      <apx-chart [series]="lineSeries" [chart]="lineChart" [stroke]="lineStroke" [xaxis]="{ categories: lineLabels }"></apx-chart>
    </div>
  </div>

  <!-- ===== NOTIFICATIONS ===== -->
  <div class="notifications">
    <h3>Notifications</h3>

    <div class="notif" *ngFor="let n of notifications">
      <span>{{ n.message }}</span>
      <small>{{ n.time }}</small>
    </div>
  </div>
</div>
