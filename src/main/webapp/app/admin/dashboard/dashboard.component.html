<div class="dashboard-page">
  <header class="dashboard-header">
    <h1>Tableau de bord</h1>
    <p class="subtitle">Vue d'ensemble de l'activité du système</p>
  </header>

  <!-- Stat cards -->
  <section class="stats-grid">
    <div class="stat-card" *ngFor="let s of stats">
      <div class="stat-card-top">
        <div class="stat-title">{{ s.title }}</div>
        <div class="stat-icon" [style.color]="s.color">
          <i [ngClass]="s.icon" class="bi" style="font-size: 20px"></i>
        </div>
      </div>
      <div class="stat-value" [style.color]="s.color">{{ s.value }}</div>
    </div>
  </section>

  <!-- Charts row -->
  <section class="charts-row">
    <div class="chart-card chart-pie">
      <h3>Répartition par série</h3>
      <ngx-charts-pie-chart
        [view]="[380, 260]"
        [results]="seriesData"
        [labels]="true"
        [legend]="false"
        [doughnut]="false"
        [explodeSlices]="false"
        [animations]="animations"
      >
      </ngx-charts-pie-chart>
    </div>

    <div class="chart-card chart-bar">
      <h3>Répartition par région</h3>
      <ngx-charts-bar-vertical
        [view]="[520, 260]"
        [results]="regionData"
        [xAxis]="true"
        [yAxis]="true"
        [showGridLines]="true"
        [gradient]="gradient"
        [animations]="animations"
        [barPadding]="12"
        [roundDomains]="true"
      >
      </ngx-charts-bar-vertical>
    </div>
  </section>

  <!-- Full width chart -->
  <section class="full-width-chart">
    <div class="chart-card">
      <h3>Évolution mensuelle des inscriptions</h3>
      <ngx-charts-line-chart
        [view]="[1200, 300]"
        [results]="monthlyData"
        [legend]="false"
        [xAxis]="true"
        [yAxis]="true"
        [autoScale]="true"
        [timeline]="false"
        [animations]="animations"
      >
      </ngx-charts-line-chart>
    </div>
  </section>

  <!-- Notifications -->
  <section class="notifications">
    <h3>Notifications récentes</h3>
    <div class="notifications-list">
      <div class="notification" *ngFor="let n of notifications">
        <div class="bullet" [ngClass]="n.type"></div>
        <div class="notif-body">
          <div class="msg">{{ n.message }}</div>
          <div class="time">{{ n.time }}</div>
        </div>
      </div>
    </div>
  </section>
</div>
